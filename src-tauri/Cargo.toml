[package]
name = "shiftconvert"
version = "0.1.0"
edition = "2021"
description = "ShiftConvert - Conversor de arquivos com roda radial Orbit Minimal para Windows"

[dependencies]
tauri = { version = "2", features = ["common-controls-v6", "tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
log = "0.4"
env_logger = "0.11"
image = "0.25"
zip = "0.6"
rfd = "0.15"
base64 = "0.22"
html2text = "0.17"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
pdf-extract = "0.12"
quick-xml = "0.42"

[target.'cfg(windows)'.dependencies]
windows-core = "0.62"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_LibraryLoader",
  "Win32_System_Ole",
  "Win32_System_SystemServices",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
